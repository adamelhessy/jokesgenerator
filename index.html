<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <title>Jokes Generator</title>
  </head>
  <body>
    <div
      class="min-vh-100 w-100 bg-black d-flex align-items-center flex-column"
    >
      <div
        class="justify-content-center align-items-center d-flex flex-column p-5 gap-4"
      >
        <h1
          class="fs-1 fw-bold text-decoration-underline text-danger text-center"
        >
          Enter Number From 0 to 99
        </h1>
        <input
          class="bg-danger form-control text-warning meme_input"
          type="text"
          style="width: 200px"
        />
        <button
          type="button"
          class="btn btn-outline-danger text-warning meme_btn"
        >
          Show Meme
        </button>
        <div
          class="meme_cont justify-content-center align-items-center d-flex flex-column w-100"
        ></div>
      </div>
    </div>

    <script src="js/index..js"></script>
  </body>
</html>
